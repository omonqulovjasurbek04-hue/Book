<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        'primary-hover': '#4338CA',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 h-screen overflow-hidden flex flex-col">
    <!-- Navbar -->
    <header class="bg-white border-b border-gray-200">
        <div class="px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-900">Admin Panel</h1>
            <div class="flex items-center gap-4">
                <span id="userEmail" class="text-sm text-gray-600">Loading...</span>
                <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800 font-medium">Logout</button>
            </div>
        </div>
    </header>

    <div class="flex-1 overflow-auto p-6 space-y-6">
        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="statsContainer">
            <!-- Loading stats... -->
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-900">Items (Books)</h2>
                <button onclick="openModal()" class="bg-primary text-white px-4 py-2 rounded-lg text-sm hover:bg-primary-hover">Add New</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-500 text-sm">
                        <tr>
                            <th class="px-6 py-3 font-medium">ID</th>
                            <th class="px-6 py-3 font-medium">Name</th>
                            <th class="px-6 py-3 font-medium">Description</th>
                            <th class="px-6 py-3 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200">
                        <!-- Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="itemModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-semibold">Add Item</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <div class="p-6">
                <form id="itemForm" class="space-y-4">
                    <input type="hidden" id="itemId">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Name</label>
                        <input type="text" id="itemTitle" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Description</label>
                        <textarea id="itemDesc" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary"></textarea>
                    </div>
                    <div class="flex justify-end gap-3 mt-6">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 border rounded-lg">Cancel</button>
                        <button type="submit" class="px-4 py-2 text-sm text-white bg-primary hover:bg-primary-hover rounded-lg">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://127.0.0.1:8000/api' 
            : '/api';
            
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = 'index.html';

        const headers = {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/json',
            'Content-Type': 'application/json'
        };

        async function fetchAPI(endpoint, options = {}) {
            const res = await fetch(`${API_URL}${endpoint}`, { ...options, headers: { ...headers, ...options.headers } });
            if (res.status === 401) {
                logout();
                return;
            }
            return res.json();
        }

        async function loadDashboard() {
            try {
                // Fetch user
                const user = await fetchAPI('/me');
                if (user) document.getElementById('userEmail').textContent = user.email;

                // Fetch items
                const res = await fetchAPI('/items');
                if (res && res.data) {
                    renderTable(res.data);
                    renderStats(res.data.length);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderStats(totalItems) {
            document.getElementById('statsContainer').innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <p class="text-sm font-medium text-gray-500">Total Items</p>
                    <p class="mt-2 text-3xl font-bold text-gray-900">${totalItems}</p>
                </div>
            `;
        }

        function renderTable(items) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = items.map(item => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 text-sm text-gray-900">#${item.id}</td>
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">${item.title}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${item.description || '-'}</td>
                    <td class="px-6 py-4 text-sm text-right space-x-3">
                        <button onclick="editItem(${item.id}, '${(item.title || '').replace(/'/g, "\\'")}', '${(item.description || '').replace(/'/g, "\\'")}')" class="text-primary hover:text-primary-hover">Edit</button>
                        <button onclick="deleteItem(${item.id})" class="text-red-600 hover:text-red-800">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // Modal Logic
        const modal = document.getElementById('itemModal');
        const form = document.getElementById('itemForm');

        function openModal() {
            form.reset();
            document.getElementById('itemId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Item';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function editItem(id, title, desc) {
            document.getElementById('itemId').value = id;
            document.getElementById('itemTitle').value = title;
            document.getElementById('itemDesc').value = desc;
            document.getElementById('modalTitle').textContent = 'Edit Item';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const title = document.getElementById('itemTitle').value;
            const description = document.getElementById('itemDesc').value;

            try {
                if (id) {
                    await fetchAPI(`/items/${id}`, { method: 'PUT', body: JSON.stringify({ title, description }) });
                } else {
                    await fetchAPI('/items', { method: 'POST', body: JSON.stringify({ title, description }) });
                }
                closeModal();
                loadDashboard();
            } catch (err) {
                alert('Error saving item');
            }
        });

        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            try {
                await fetchAPI(`/items/${id}`, { method: 'DELETE' });
                loadDashboard();
            } catch (err) {
                alert('Error deleting item');
            }
        }

        async function logout() {
            try {
                await fetchAPI('/logout', { method: 'POST' });
            } catch (err) {}
            localStorage.removeItem('admin_token');
            window.location.href = 'index.html';
        }

        loadDashboard();
    </script>
</body>
</html>
